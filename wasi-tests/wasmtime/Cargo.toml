[package]
name = "test-programs"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 WITH LLVM-exception"
autobins = false

# Build the unchanged P1 programs without the rest of the Wasmtime workspace.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
wasip1 = "=1.0.0"
libc = "=0.2.185"

[profile.release]
debug = 1

[[bin]]
name = "p1_big_random_buf"
