name: Check and Test
on:
  pull_request:
  push:
    branches:
      - $default-branch

env:
  WASM_TOOLS_VERSION: "1.248.0"
  MOONBIT_INSTALL_VERSION: "nightly"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        id: moon_check
        continue-on-error: true
        run: |
          set -euxo pipefail
          moon check --target native 2>&1 | tee /tmp/moon_check_native.log

      - name: dump moon check log (if any)
        if: steps.moon_check.outcome != 'success'
        run: |
          set -euxo pipefail
          cat /tmp/moon_check_native.log || true

      - name: fail fast if moon check failed
        if: steps.moon_check.outcome != 'success'
        run: exit 1

      - name: moon test
        run: |
          MACHV_REGALLOC_VALIDATION=1 moon test --target native

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

      - name: build wasmoon
        run: |
          moon build --target native --release
          ./install.sh

      - name: install wasm-tools
        run: |
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          wasm-tools --version

      - name: run component-spec subset
        timeout-minutes: 5
        run: |
          python3 scripts/run_component_wast.py --dir component-spec --rec --dump-failures

      - name: run wast spec tests
        timeout-minutes: 5
        run: |
          python3 scripts/run_all_wast.py --dir spec --rec

  build-ubuntu-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3 gdb

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        id: moon_check
        continue-on-error: true
        run: |
          set -euxo pipefail
          moon check --target native 2>&1 | tee /tmp/moon_check_native.log

      - name: dump moon check log (if any)
        if: steps.moon_check.outcome != 'success'
        run: |
          set -euxo pipefail
          cat /tmp/moon_check_native.log || true

      - name: fail fast if moon check failed
        if: steps.moon_check.outcome != 'success'
        run: exit 1

      - name: moon test
        id: moon_test
        continue-on-error: true
        run: |
          MACHV_REGALLOC_VALIDATION=1 moon test --target native --no-parallelize -v

      - name: dump failing rspfile (if any)
        if: steps.moon_test.outcome != 'success'
        run: |
          set -euxo pipefail
          echo "=== rspfiles under _build/native/debug/test ==="
          find _build/native/debug/test -name '*.rspfile' -maxdepth 4 -print || true
          echo "=== testsuite.whitebox_test.rspfile ==="
          cat _build/native/debug/test/testsuite/testsuite.whitebox_test.rspfile || true

      - name: gdb backtrace (testsuite whitebox)
        if: steps.moon_test.outcome != 'success'
        continue-on-error: true
        run: |
          set -euxo pipefail
          # Build tests without running them, then run the failing whitebox
          # test executable under gdb to capture a backtrace.
          moon test --target native --no-parallelize -v --build-only -p testsuite

          RSP="_build/native/debug/test/testsuite/testsuite.whitebox_test.rspfile"
          NORUN="/tmp/testsuite.whitebox_test.norun.rspfile"
          BIN="/tmp/testsuite.whitebox_test"
          grep -v '^-run$' "$RSP" > "$NORUN"

          MOON_BIN="$(dirname "$(command -v moon)")"
          MOON_HOME="$(dirname "$MOON_BIN")"
          "$MOON_HOME/bin/internal/tcc" @"$NORUN" -o "$BIN"

          ulimit -c unlimited || true
          export LD_LIBRARY_PATH="$PWD/_build/native/debug/test:$PWD/_build/native/debug/test/jit/jit_ffi:$PWD/_build/native/debug/test/vcode/isa:$PWD/_build/native/debug/test/.mooncakes/moonbitlang/x/fs:$PWD/_build/native/debug/test/wasi${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # Reconstruct the argv filter that `moon test` passes to the whitebox
          # test runner (e.g. "foo_wbtest.mbt:0-3/bar_wbtest.mbt:0-2/...").
          FILTER_ARG="$(
            python3 -c 'import json; info=json.load(open("_build/native/debug/test/testsuite/__whitebox_test_info.json")); print("/".join(f"{k}:0-{len(v)}" for k, v in info["tests"].items()))'
          )"

          MALLOC_CHECK_=3 MALLOC_PERTURB_=165 \
            gdb -q -batch \
              -ex 'set pagination off' \
              -ex 'handle SIGPIPE nostop noprint pass' \
              -ex run \
              -ex bt \
              -ex 'info registers' \
              -ex 'info symbol $r11' \
              -ex 'info symbol $r12' \
              -ex 'info symbol $r14' \
              -ex 'info symbol $r15' \
              -ex 'info symbol $pc' \
              -ex 'info proc mappings' \
              -ex 'info sharedlibrary' \
              -ex 'x/48i $pc-96' \
              -ex 'x/48i $pc' \
              --args "$BIN" "$FILTER_ARG"

      - name: fail fast if moon test failed
        if: steps.moon_test.outcome != 'success'
        run: exit 1

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

      - name: build wasmoon
        run: |
          moon build --target native --release
          ./install.sh

      - name: install wasm-tools
        run: |
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          wasm-tools --version

      - name: run component-spec subset (amd64)
        timeout-minutes: 5
        run: |
          python3 scripts/run_component_wast.py --dir component-spec --rec --dump-failures

      - name: run wast spec tests (amd64)
        id: wast_amd64
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python3 scripts/run_all_wast.py --dir spec --rec

      - name: dump amd64 JIT regressions
        if: steps.wast_amd64.outcome != 'success'
        run: |
          set -euxo pipefail
          python3 scripts/run_all_wast.py --dir spec --rec --dump-failures || true
          for f in \
            call.wast \
            call_indirect.wast \
            exceptions/try_table.wast \
            gc/array.wast \
            gc/array_init_data.wast \
            gc/array_init_elem.wast \
            gc/array_new_elem.wast \
            gc/i31.wast \
            left-to-right.wast \
            simd/simd_i64x2_cmp.wast
          do
            echo "===== amd64 debug: $f ====="
            ./wasmoon test "spec/$f" -D || true
          done

      - name: fail fast if wast spec tests failed (amd64)
        if: steps.wast_amd64.outcome != 'success'
        run: exit 1

  build-ubuntu-sanitizer:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build wasmoon (sanitizer)
        run: |
          moon build --target native --release
          ./install.sh

      - name: run GC differential stress matrix (sanitizer)
        timeout-minutes: 10
        run: |
          python3 scripts/find_gc_bugs.py --dir spec/gc --timeout 30

      - name: run GC differential fault-injection lane (sanitizer)
        timeout-minutes: 10
        run: |
          python3 scripts/find_gc_bugs.py --dir spec/gc --timeout 30 --max-files 64 --fault-alloc-every 7
