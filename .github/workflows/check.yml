name: Check and Test

on:
  workflow_dispatch:
    inputs:
      sanitizers_only:
        description: Run only the sanitizer diagnostic gate
        type: boolean
        default: false
      windows_only:
        description: Run only the Windows port diagnostic gate
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      # `$default-branch` is a starter-workflow placeholder that GitHub never
      # substitutes, so this trigger matched nothing and no push to main ever
      # ran these checks. Name the branch.
      - main

concurrency:
  group: check-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

env:
  COMPONENT_WASM_TOOLS_VERSION: "1.254.0"
  MOONBIT_TOOLCHAIN_VERSION: "nightly"

jobs:
  native-platform:
    if: ${{ inputs.windows_only != true && inputs.sanitizers_only != true }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            os: ubuntu-latest
            native_test_args: --no-parallelize
          - name: macOS ARM64
            os: macos-latest
            native_test_args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3

      - name: install toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_TOOLCHAIN_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          cargo install wasm-tools \
            --version "$COMPONENT_WASM_TOOLS_VERSION" --locked

      - name: report toolchain
        run: |
          moon version --all
          moon update
          wasm-tools --version
          uname -a

      - name: check source and generated interfaces
        run: |
          moon check --target native --warn-list +73 --deny-warn
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_committed_diff.py \
            --base "$base" --head "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 scripts/audit_module_boundaries.py
          python3 scripts/run_wasmtime_p1.py --check
          python3 scripts/run_wasmtime_misc.py --check
          python3 scripts/audit_jit_context_lifetimes.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/audit_component_security.py
          python3 scripts/check_component_snapshot.py
          python3 modules/wasmoon/wasi_component/tools/generate_wasi_contracts.py \
            modules/wasmoon/wasi_component/wit \
            modules/wasmoon/wasi_component/wit_contracts_generated.mbt \
            --verify-wit --check

      - name: verify HTTP WIT contracts
        run: python3 modules/wasmoon/wasi_http/generate_contracts.py --verify-wit --check

      - name: run native tests
        run: |
          VCODE_REGALLOC_VALIDATION=1 \
            moon test --target native ${{ matrix.native_test_args }}

      - name: build Wasmoon
        id: build
        run: |
          moon build --target native --release
          if nm \
            target/native/release/build/Milky2018/wasmoon_jit/jit_ffi/libjit_ffi.a \
            | grep "live_gc_frame_count" >/dev/null; then
            echo "release libjit_ffi.a contains test-only GC frame counters"
            exit 1
          fi
          ./install.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install independently packaged modules
        run: |
          python3 scripts/check_native_c.py
          python3 scripts/test_packaged_install.py

      - name: test HTTP services, middleware and clients on both engines
        run: python3 scripts/test_wasi_http.py --wasmoon ./wasmoon

      - name: check out pinned WASI Preview 3 guests
        uses: actions/checkout@v4
        with:
          repository: WebAssembly/wasi-testsuite
          ref: 609c446139956ff30239f87cb18af1dc6128bed2
          path: target/wasi03-upstream
      - name: install upstream WASI runner dependencies
        run: python -m pip install -r target/wasi03-upstream/test-runner/requirements.txt
      - name: test external WASI Preview 3 guests on both engines
        run: python scripts/run_wasi03.py --upstream target/wasi03-upstream --wasmoon ./wasmoon --output target/wasi03-results --timeout 120 --acknowledge-known-differences
      - name: upload raw WASI Preview 3 acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasi03-${{ matrix.os }}
          path: target/wasi03-results
          if-no-files-found: warn

      - name: run complete Wasmtime misc suite
        run: |
          python3 scripts/run_wasmtime_misc.py \
            --include-high-memory --timeout 120 \
            --output target/wasmtime-misc

      - name: upload Wasmtime misc results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasmtime-misc-${{ matrix.os }}
          path: target/wasmtime-misc
          if-no-files-found: warn

      - name: exercise WASIp1 capability path races
        run: python3 scripts/run_wasi_path_races.py

      - name: verify JIT cache lifecycle
        run: python3 scripts/run_jit_cache.py

      - name: verify WASIp1 physical allocation
        run: python3 scripts/run_wasi_allocation.py

      - name: run upstream WASIp1 polling regressions
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-wasip1
          RUSTUP_TOOLCHAIN=1.97.0 python3 scripts/run_wasmtime_p1.py \
            --filter p1_poll_oneoff_stdio --output target/wasmtime-p1-smoke

      - name: run WASIp1 rights and implemented-capability regressions
        run: |
          RUSTUP_TOOLCHAIN=1.97.0 python3 scripts/run_wasmtime_p1.py \
            --profile capabilities --output target/wasmtime-p1-rights

      - name: upload WASIp1 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasip1-${{ matrix.os }}
          path: |
            target/wasi-path-races.json
            target/wasi-allocation.json
            target/wasmtime-p1-smoke
            target/wasmtime-p1-rights
          if-no-files-found: ignore

      # Before the suites below, because they trust the exit status this
      # checks: `run_all_wast.py` reads `wasmoon test`'s status as its
      # verdict, so a regression here would make those steps report on a
      # runner that is lying to them.
      - name: run CLI behaviour tests
        run: python3 scripts/cli_behavior_test.py

      - name: run core WAST tests
        # Preserve independent core diagnostics after a misc failure.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 scripts/run_all_wast.py --dir spec --rec
          # Exercise the previously reported Linux call_ref failure with
          # fresh process state, retaining the first complete failure report.
          for attempt in $(seq 1 32); do
            if ! ./wasmoon test spec/call_ref.wast > /tmp/call-ref-repeat.log 2>&1; then
              echo "call_ref failed on repeat $attempt"
              cat /tmp/call-ref-repeat.log
              exit 1
            fi
          done
          echo "call_ref passed in 32 fresh processes"
          python3 scripts/find_gc_bugs.py --dir spec/gc --timeout 30
          python3 scripts/find_gc_bugs.py \
            --dir spec/gc --timeout 30 --max-files 64 --fault-alloc-every 7

      - name: run WASI Preview 1 tests
        run: python3 examples/wasi_tests/wasi_test.py

      - name: run stable Component Model 0.2
        timeout-minutes: 20
        run: |
          status=0
          python3 scripts/run_component_wast.py \
            --suite stable-0.2 --dump-failures || status=$?
          python3 scripts/run_component_wast.py \
            --suite stable-0.2 --dump-failures --no-jit || status=$?
          exit "$status"

      - name: run Component Model 0.3 async
        timeout-minutes: 20
        run: |
          status=0
          python3 scripts/run_component_wast.py \
            --suite async-0.3 --dump-failures || status=$?
          python3 scripts/run_component_wast.py \
            --suite async-0.3 --dump-failures --no-jit || status=$?
          exit "$status"

      - name: run future-gated Component Model features
        timeout-minutes: 20
        run: |
          status=0
          python3 scripts/run_component_wast.py \
            --suite future-gated --dump-failures || status=$?
          python3 scripts/run_component_wast.py \
            --suite future-gated --dump-failures --no-jit || status=$?
          exit "$status"

  windows-native:
    if: ${{ inputs.sanitizers_only != true }}
    name: Windows AMD64 (${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, msvc]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MOONBIT_INSTALL_VERSION: nightly
      MOON_CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" >> $env:GITHUB_PATH
      - name: configure Microsoft C and MASM
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: . ./scripts/msvc/setup.ps1
      - name: report toolchain
        run: |
          moon version --all
          clang --version
          python scripts/msvc/generate_guest_bridges.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          moon update
      - name: install Windows wasm-tools
        shell: pwsh
        run: |
          $version = $env:COMPONENT_WASM_TOOLS_VERSION
          $archive = "wasm-tools-$version-x86_64-windows.zip"
          New-Item -ItemType Directory -Force target/windows-tools | Out-Null
          Invoke-WebRequest "https://github.com/bytecodealliance/wasm-tools/releases/download/v$version/$archive" -OutFile "target/$archive"
          Expand-Archive "target/$archive" target/windows-tools
          $tools = @(Get-ChildItem target/windows-tools -Recurse -Filter wasm-tools.exe)
          if ($tools.Count -ne 1) { throw "Expected exactly one pinned wasm-tools binary" }
          $tools[0].DirectoryName >> $env:GITHUB_PATH
      - name: check Windows warnings
        run: moon check --target native --warn-list +73 --deny-warn

      - name: test Windows descriptor readiness
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          python -m unittest discover -s scripts/tests -p 'test_wasi_windows_*.py' -v 2>&1 | Tee-Object -FilePath target/windows-native-probes.log
          exit $LASTEXITCODE

      - name: upload Windows native probe evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.compiler }}-native-probes
          path: target/windows-native-probes.log

      - name: test Windows file allocation
        run: python -m unittest scripts.tests.test_wasi_file_semantics scripts.tests.test_wasi_process scripts.tests.test_wasi03_runner -v

      - name: build Windows runtime
        id: windows_build
        if: ${{ !cancelled() }}
        run: |
          moon build --target native --release --jobs 2 --target-dir target/windows-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/windows-build/native/release/build/Milky2018/wasmoon/cmd/wasmoon/wasmoon.exe wasmoon.exe
          Copy-Item target/windows-build/native/release/build/Milky2018/wasmoon/cmd/wasmoon-tools/wasmoon-tools.exe wasmoon-tools.exe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install independently packaged modules on Windows
        run: |
          python scripts/check_native_c.py
          python scripts/test_packaged_install.py

      - name: test Windows HTTP services, middleware and clients on both engines
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/test_wasi_http.py --wasmoon ./wasmoon.exe

      - name: check out pinned WASI Preview 3 guests
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: WebAssembly/wasi-testsuite
          ref: 609c446139956ff30239f87cb18af1dc6128bed2
          path: target/wasi03-upstream
      - name: install upstream WASI runner dependencies
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python -m pip install -r target/wasi03-upstream/test-runner/requirements.txt
      - name: test external WASI Preview 3 guests on both engines
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/run_wasi03.py --upstream target/wasi03-upstream --wasmoon ./wasmoon.exe --output target/wasi03-results --timeout 120 --acknowledge-known-differences
      - name: upload raw WASI Preview 3 acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasi03-windows-${{ matrix.compiler }}
          path: target/wasi03-results
          if-no-files-found: warn

      - name: verify Windows CLI behavior
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/cli_behavior_test.py
      - name: test Windows symlink permission environments
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          $property = "AllowDevelopmentWithoutDevLicense"
          New-Item -Path $key -Force | Out-Null
          $old = Get-ItemProperty -Path $key -Name $property -ErrorAction SilentlyContinue
          try {
            foreach ($mode in @(0, 1)) {
              Set-ItemProperty -Path $key -Name $property -Type DWord -Value $mode
              $env:WASMOON_TEST_DEVELOPER_MODE = "$mode"
              python -m unittest scripts.tests.test_wasi_windows_files.WindowsFileTests.test_unprivileged_symlink scripts.tests.test_wasi_windows_files.WindowsFileTests.test_unprivileged_symlink_after_ancestor_replacement scripts.tests.test_wasi_windows_files.WindowsFileTests.test_unprivileged_symlink_during_parent_renames scripts.tests.test_wasi_windows_files.WindowsFileTests.test_workspace_and_temp_volume_symlinks_with_disabled_privilege -v
              if ($LASTEXITCODE -ne 0) { throw "Symlink permission matrix failed in Developer Mode $mode" }
              python scripts/run_windows_symlinks.py
              if ($LASTEXITCODE -ne 0) { throw "Symlink guest matrix failed in Developer Mode $mode" }
            }
          } finally {
            Remove-Item Env:WASMOON_TEST_DEVELOPER_MODE -ErrorAction SilentlyContinue
            if ($null -eq $old) {
              Remove-ItemProperty -Path $key -Name $property -ErrorAction SilentlyContinue
            } else {
              Set-ItemProperty -Path $key -Name $property -Type DWord -Value $old.$property
            }
          }

      - name: run Windows core suites
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/run_all_wast.py --rec --dump-failures
      - name: exercise Windows WASIp1 capability path races
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/run_wasi_path_races.py
      - name: verify Windows JIT cache lifecycle
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/run_jit_cache.py
      - name: verify Windows WASIp1 physical allocation
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/run_wasi_allocation.py
      - name: run Windows readiness guests
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: python scripts/run_windows_readiness.py
      - name: run Windows component suites
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: |
          $failed = $false
          New-Item -ItemType Directory -Force target/windows-components | Out-Null
          foreach ($suite in @("stable-0.2", "async-0.3", "future-gated")) {
            python scripts/run_component_wast.py --suite $suite --dump-failures 2>&1 | Tee-Object -FilePath "target/windows-components/$suite-jit.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            python scripts/run_component_wast.py --suite $suite --dump-failures --no-jit 2>&1 | Tee-Object -FilePath "target/windows-components/$suite-interp.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: run Windows Wasmtime misc suite
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        run: |
          python scripts/run_wasmtime_misc.py --include-high-memory --timeout 120 --output target/windows-misc 2>&1 | Tee-Object -FilePath target/windows-misc-run.log
          exit $LASTEXITCODE
      - name: run Windows WASIp1 suites
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: "1.97.0"
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-wasip1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_wasmtime_p1.py --filter p1_poll_oneoff_stdio --output target/windows-p1-smoke
          $smoke = $LASTEXITCODE
          python scripts/run_wasmtime_p1.py --profile capabilities --output target/windows-p1-rights
          if ($LASTEXITCODE -ne 0 -or $smoke -ne 0) { exit 1 }
      - name: upload Windows corpus evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.compiler }}-corpus-evidence
          path: |
            target/windows-native-probes.log
            target/windows-symlinks-*.json
            target/wasi-path-races.json
            target/wasi-allocation.json
            target/windows-readiness.json
            target/windows-components
            target/windows-misc
            target/windows-misc-run.log
            target/windows-p1-smoke
            target/windows-p1-rights
          if-no-files-found: warn
      - name: run Windows native tests
        if: ${{ !cancelled() && steps.windows_build.outcome == 'success' }}
        env:
          VCODE_REGALLOC_VALIDATION: "1"
        run: python scripts/run_native_packages.py --output target/windows-native-tests
      - name: upload Windows test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.compiler }}-native-evidence
          path: |
            target/windows-native-tests
            target/windows-native-probes.log
            target/windows-symlinks-*.json
            target/wasi-path-races.json
            target/wasi-allocation.json
            target/windows-readiness.json
            target/windows-components
            target/windows-misc
            target/windows-misc-run.log
            target/windows-p1-smoke
            target/windows-p1-rights
          if-no-files-found: warn

  sanitizers:
    if: ${{ inputs.windows_only != true }}
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_TOOLCHAIN_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: instrument MoonBit and native stubs and prove detection
        # Supported package flags instrument generated C and handwritten stubs.
        # Separate failing processes prove detection in both kinds of source.
        # Prebuilt runtime objects and dynamically emitted JIT code are excluded.
        run: |
          moon update
          python3 scripts/run_sanitizers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-evidence
          path: |
            target/sanitizers/tests.log
            target/sanitizers/probe.log
            target/sanitizers/native-probe.log
            target/sanitizers/symbols.log
            target/sanitizers/summary.json
            target/sanitizers/isolated
          if-no-files-found: warn
