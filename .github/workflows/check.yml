name: Check and Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - $default-branch

env:
  WASM_TOOLS_VERSION: "1.248.0"
  COMPONENT_WASM_TOOLS_VERSION: "1.254.0"
  MOONBIT_INSTALL_VERSION: "nightly"

jobs:
  detect-machv-cutover:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect a cutover closing change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python3 scripts/detect_cutover_closing_change.py \
            --base "$BASE_SHA" --head "$HEAD_SHA"
          then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        id: moon_check
        continue-on-error: true
        run: |
          set -euxo pipefail
          moon check --target native 2>&1 | tee /tmp/moon_check_native.log

      - name: dump moon check log (if any)
        if: steps.moon_check.outcome != 'success'
        run: |
          set -euxo pipefail
          cat /tmp/moon_check_native.log || true

      - name: fail fast if moon check failed
        if: steps.moon_check.outcome != 'success'
        run: exit 1

      - name: moon test
        run: |
          MACHV_REGALLOC_VALIDATION=1 moon test --target native

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code
          python3 scripts/audit_module_boundaries.py
          python3 scripts/audit_semantic_machv_api.py
          python3 scripts/audit_internal_compatibility.py

      - name: build wasmoon
        run: |
          moon build --target native --release
          ./install.sh

      - name: run wast spec tests
        timeout-minutes: 5
        run: |
          python3 scripts/run_all_wast.py --dir spec --rec

  build-ubuntu-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3 gdb

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        id: moon_check
        continue-on-error: true
        run: |
          set -euxo pipefail
          moon check --target native 2>&1 | tee /tmp/moon_check_native.log

      - name: dump moon check log (if any)
        if: steps.moon_check.outcome != 'success'
        run: |
          set -euxo pipefail
          cat /tmp/moon_check_native.log || true

      - name: fail fast if moon check failed
        if: steps.moon_check.outcome != 'success'
        run: exit 1

      - name: moon test
        id: moon_test
        continue-on-error: true
        run: |
          MACHV_REGALLOC_VALIDATION=1 moon test --target native --no-parallelize -v

      - name: dump failing rspfile (if any)
        if: steps.moon_test.outcome != 'success'
        run: |
          set -euxo pipefail
          echo "=== rspfiles under _build/native/debug/test ==="
          find _build/native/debug/test -name '*.rspfile' -maxdepth 4 -print || true
          echo "=== testsuite.whitebox_test.rspfile ==="
          cat _build/native/debug/test/Milky2018/wasmoon/testsuite/testsuite.whitebox_test.rspfile || true

      - name: gdb backtrace (testsuite whitebox)
        if: steps.moon_test.outcome != 'success'
        continue-on-error: true
        run: |
          set -euxo pipefail
          # Build tests without running them, then run the failing whitebox
          # test executable under gdb to capture a backtrace.
          moon test --target native --no-parallelize -v --build-only -p testsuite

          RSP="_build/native/debug/test/Milky2018/wasmoon/testsuite/testsuite.whitebox_test.rspfile"
          NORUN="/tmp/testsuite.whitebox_test.norun.rspfile"
          BIN="/tmp/testsuite.whitebox_test"
          grep -v '^-run$' "$RSP" > "$NORUN"

          MOON_BIN="$(dirname "$(command -v moon)")"
          MOON_HOME="$(dirname "$MOON_BIN")"
          "$MOON_HOME/bin/internal/tcc" @"$NORUN" -o "$BIN"

          ulimit -c unlimited || true
          export LD_LIBRARY_PATH="$PWD/_build/native/debug/test:$PWD/_build/native/debug/test/Milky2018/wasmoon_jit:$PWD/_build/native/debug/test/moonbitlang/x/fs:$PWD/_build/native/debug/test/Milky2018/wasmoon/wasi${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # Reconstruct the argv filter that `moon test` passes to the whitebox
          # test runner (e.g. "foo_wbtest.mbt:0-3/bar_wbtest.mbt:0-2/...").
          FILTER_ARG="$(
            python3 -c 'import json; info=json.load(open("_build/native/debug/test/Milky2018/wasmoon/testsuite/__whitebox_test_info.json")); print("/".join(f"{k}:0-{len(v)}" for k, v in info["tests"].items()))'
          )"

          MALLOC_CHECK_=3 MALLOC_PERTURB_=165 \
            gdb -q -batch \
              -ex 'set pagination off' \
              -ex 'handle SIGPIPE nostop noprint pass' \
              -ex run \
              -ex bt \
              -ex 'info registers' \
              -ex 'info symbol $r11' \
              -ex 'info symbol $r12' \
              -ex 'info symbol $r14' \
              -ex 'info symbol $r15' \
              -ex 'info symbol $pc' \
              -ex 'info proc mappings' \
              -ex 'info sharedlibrary' \
              -ex 'x/48i $pc-96' \
              -ex 'x/48i $pc' \
              --args "$BIN" "$FILTER_ARG"

      - name: fail fast if moon test failed
        if: steps.moon_test.outcome != 'success'
        run: exit 1

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code
          python3 scripts/audit_module_boundaries.py
          python3 scripts/audit_semantic_machv_api.py
          python3 scripts/audit_internal_compatibility.py

      - name: build wasmoon
        run: |
          moon build --target native --release
          ./install.sh

      - name: run wast spec tests (amd64)
        id: wast_amd64
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python3 scripts/run_all_wast.py --dir spec --rec

      - name: dump amd64 JIT regressions
        if: steps.wast_amd64.outcome != 'success'
        run: |
          set -euxo pipefail
          python3 scripts/run_all_wast.py --dir spec --rec --dump-failures || true
          for f in \
            call.wast \
            call_indirect.wast \
            exceptions/try_table.wast \
            gc/array.wast \
            gc/array_init_data.wast \
            gc/array_init_elem.wast \
            gc/array_new_elem.wast \
            gc/i31.wast \
            left-to-right.wast \
            simd/simd_i64x2_cmp.wast
          do
            echo "===== amd64 debug: $f ====="
            ./wasmoon test "spec/$f" -D || true
          done

      - name: fail fast if wast spec tests failed (amd64)
        if: steps.wast_amd64.outcome != 'success'
        run: exit 1

  component-model:
    name: Component Model (${{ matrix.suite }}, ${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        suite:
          - stable-0.2
          - async-0.3
          - future-gated
        engine:
          - jit
          - interpreter
    steps:
      - uses: actions/checkout@v4

      - name: verify pinned official snapshot
        run: python3 scripts/check_component_snapshot.py

      - name: install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: prepare toolchain
        run: |
          moon version --all
          moon update
          cargo install wasm-tools \
            --version "$COMPONENT_WASM_TOOLS_VERSION" --locked
          wasm-tools --version

      - name: verify generated WASI host contracts
        run: |
          python3 modules/wasmoon/wasi_component/tools/generate_wasi_contracts.py \
            modules/wasmoon/wasi_component/wit \
            modules/wasmoon/wasi_component/wit_contracts_generated.mbt \
            --verify-wit --check

      - name: build Wasmoon component harness
        run: |
          moon build --target native --release
          ./install.sh

      - name: run ${{ matrix.suite }} suite
        timeout-minutes: 10
        run: |
          args=()
          if [ "${{ matrix.engine }}" = "interpreter" ]; then
            args+=(--no-jit)
          fi
          python3 scripts/run_component_wast.py \
            --suite "${{ matrix.suite }}" \
            --dump-failures \
            "${args[@]}"

  build-ubuntu-sanitizer:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: initialize sanitizer evidence manifest
        run: |
          mkdir -p target/cutover-gate/linux-amd64-sanitizer/logs
          python3 scripts/cutover_gate_manifest.py init \
            --manifest target/cutover-gate/linux-amd64-sanitizer/manifest.json \
            --kind sanitizer \
            --target linux-amd64

      - name: build wasmoon (sanitizer)
        run: |
          python3 scripts/cutover_gate_manifest.py run \
            --manifest target/cutover-gate/linux-amd64-sanitizer/manifest.json \
            --name build-sanitizer \
            --log target/cutover-gate/linux-amd64-sanitizer/logs/build.log \
            -- bash -c 'moon build --target native --release && ./install.sh'

      - name: run GC differential stress matrix (sanitizer)
        if: always()
        timeout-minutes: 10
        run: |
          python3 scripts/cutover_gate_manifest.py run \
            --manifest target/cutover-gate/linux-amd64-sanitizer/manifest.json \
            --name gc-stress \
            --log target/cutover-gate/linux-amd64-sanitizer/logs/gc-stress.log \
            -- python3 scripts/find_gc_bugs.py --dir spec/gc --timeout 30

      - name: run GC differential fault-injection lane (sanitizer)
        if: always()
        timeout-minutes: 10
        run: |
          python3 scripts/cutover_gate_manifest.py run \
            --manifest target/cutover-gate/linux-amd64-sanitizer/manifest.json \
            --name gc-fault-injection \
            --log target/cutover-gate/linux-amd64-sanitizer/logs/gc-fault-injection.log \
            -- python3 scripts/find_gc_bugs.py --dir spec/gc --timeout 30 --max-files 64 --fault-alloc-every 7

      - name: finalize sanitizer evidence manifest
        if: always()
        run: |
          python3 scripts/cutover_gate_manifest.py finalize \
            --manifest target/cutover-gate/linux-amd64-sanitizer/manifest.json \
            --required build-sanitizer,gc-stress,gc-fault-injection

      - name: upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machv-cutover-linux-amd64-sanitizer
          path: target/cutover-gate/linux-amd64-sanitizer
          if-no-files-found: error
          retention-days: 30

  machv-cutover:
    needs: detect-machv-cutover
    if: needs.detect-machv-cutover.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    env:
      CUTOVER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CUTOVER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: prepare gate toolchain
        run: |
          moon version --all
          moon update
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          wasm-tools --version

      - name: initialize cutover evidence manifest
        run: |
          mkdir -p "target/cutover-gate/${{ matrix.target }}/logs"
          python3 scripts/cutover_gate_manifest.py init \
            --manifest "target/cutover-gate/${{ matrix.target }}/manifest.json" \
            --kind target-cutover \
            --target "${{ matrix.target }}"

      - name: assert target identity
        run: |
          python3 scripts/cutover_gate_manifest.py run \
            --manifest "target/cutover-gate/${{ matrix.target }}/manifest.json" \
            --name target-identity \
            --log "target/cutover-gate/${{ matrix.target }}/logs/target-identity.log" \
            -- python3 scripts/assert_target_identity.py "${{ matrix.target }}" \
              --out "target/cutover-gate/${{ matrix.target }}/target-identity.json"

      - name: run cutover quality and correctness matrix
        if: always()
        run: |
          set +e
          status=0
          MANIFEST="target/cutover-gate/${{ matrix.target }}/manifest.json"
          LOGS="target/cutover-gate/${{ matrix.target }}/logs"
          run_gate() {
            python3 scripts/cutover_gate_manifest.py run \
              --manifest "$MANIFEST" --name "$1" --log "$LOGS/$1.log" \
              -- bash -c "$2" || status=$?
          }
          run_gate moon-fmt 'moon fmt && git diff --exit-code'
          run_gate moon-info 'moon info && git diff --exit-code'
          run_gate git-diff-check 'python3 scripts/check_committed_diff.py'
          run_gate moon-check 'moon check --target native --warn-list +73'
          run_gate moon-test 'MACHV_REGALLOC_VALIDATION=1 moon test --target native --no-parallelize'
          run_gate boundary-audits 'python3 scripts/audit_module_boundaries.py && python3 scripts/audit_semantic_machv_api.py && python3 scripts/audit_internal_compatibility.py'
          run_gate python-gate-tests 'python3 -m unittest discover -s scripts/tests -p "test_*.py"'
          run_gate build-install 'moon build --target native --release && ./install.sh'
          run_gate wast 'python3 scripts/run_all_wast.py --dir spec --rec'
          run_gate wasi 'python3 examples/wasi_tests/wasi_test.py'
          run_gate smith 'python3 scripts/run_fixed_smith_gate.py --out target/cutover-gate/${{ matrix.target }}/smith'
          exit "$status"

      - name: finalize cutover evidence manifest
        if: always()
        run: |
          python3 scripts/cutover_gate_manifest.py finalize \
            --manifest "target/cutover-gate/${{ matrix.target }}/manifest.json" \
            --required target-identity,moon-fmt,moon-info,git-diff-check,moon-check,moon-test,boundary-audits,python-gate-tests,build-install,wast,wasi,smith

      - name: upload cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machv-cutover-${{ matrix.target }}
          path: target/cutover-gate/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  machv-cutover-manifest:
    needs: [detect-machv-cutover, machv-cutover, build-ubuntu-sanitizer, build-macos, build-ubuntu-amd64, component-model]
    if: always() && needs.detect-machv-cutover.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: machv-cutover-*
          path: target/cutover-evidence
      - name: combine target evidence
        run: |
          mapfile -t manifests < <(find target/cutover-evidence -name manifest.json -type f | sort)
          test "${#manifests[@]}" -eq 3
          python3 scripts/cutover_gate_manifest.py combine \
            --out target/cutover-evidence/gate-manifest.json \
            --required-job build-macos=${{ needs.build-macos.result }} \
            --required-job build-ubuntu-amd64=${{ needs.build-ubuntu-amd64.result }} \
            --required-job component-model=${{ needs.component-model.result }} \
            "${manifests[@]}"
      - name: upload combined closing-commit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machv-cutover-gate-manifest
          path: target/cutover-evidence
          if-no-files-found: error
          retention-days: 90
