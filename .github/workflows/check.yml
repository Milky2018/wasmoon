          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          cargo install wasm-tools \
            --version "$COMPONENT_WASM_TOOLS_VERSION" --locked

      - name: report toolchain
        run: |
          moon version --all
          moon update
          wasm-tools --version
          uname -a

      - name: check source and generated interfaces
        run: |
          moon check --target native --warn-list +73
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_committed_diff.py \
