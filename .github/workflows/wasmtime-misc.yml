name: Wasmtime misc testsuite

# This diagnostic remains red for real failures; no expected-failure mask.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: Suite-relative WAST path glob
        default: '*'
        type: string
      lane:
        description: Test lane
        default: all
        type: choice
        options: [all, core, component]
      mode:
        description: Execution mode
        default: both
        type: choice
        options: [both, interp, jit]

permissions:
  contents: read

jobs:
  misc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchains
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          cargo install wasm-tools --version 1.254.0 --locked
      - name: Build Wasmoon
        run: ./install.sh
      - name: Check the corpus and runner
        run: |
          python3 scripts/run_wasmtime_misc.py --check
          python3 -m unittest discover -s scripts/tests -p 'test_wasmtime*.py'
      - name: Run misc testsuite
        env:
          MISC_FILTER: ${{ inputs.filter }}
          MISC_LANE: ${{ inputs.lane }}
          MISC_MODE: ${{ inputs.mode }}
        run: |
          python3 scripts/run_wasmtime_misc.py \
            --filter "$MISC_FILTER" --lane "$MISC_LANE" --mode "$MISC_MODE" \
            --output target/wasmtime-misc-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasmtime-misc-${{ matrix.os }}
          path: |
            target/wasmtime-misc-ci/summary.json
            target/wasmtime-misc-ci/**/stdout.txt
            target/wasmtime-misc-ci/**/stderr.txt
          if-no-files-found: warn
