name: MachV Cutover Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  MOONBIT_INSTALL_VERSION: "nightly"

jobs:
  paired-legacy-ubuntu-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl clang lld python3

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: assert AMD64 target identity
        run: |
          python3 scripts/assert_target_identity.py linux-amd64 \
            --baseline docs/perf/machv-migration/baseline.json \
            --out target/machv-cutover-perf/target-identity.json

      - name: run blocking paired fixed-legacy gate
        timeout-minutes: 90
        run: |
          python3 scripts/run_machv_cutover_perf.py \
            --baseline docs/perf/machv-migration/baseline.json \
            --out-dir target/machv-cutover-perf

      - name: upload paired samples and decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machv-cutover-perf-linux-amd64
          path: target/machv-cutover-perf
          if-no-files-found: error
          retention-days: 30
